ticker: 300750.SZ
name: 宁德时代季度经营假设
description: 验证收入增长、盈利质量、现金流和高频经营信号是否支持当前季度经营判断。
drivers:
  - id: revenue_growth
    name: 收入增速
    description: 收入同比保持两位数增长。
    metric: revenue_yoy
    operator: ">="
    threshold: 0.10
  - id: profit_growth
    name: 扣非利润增速
    description: 扣非归母净利润同比保持两位数增长。
    metric: deducted_np_yoy
    operator: ">="
    threshold: 0.10
  - id: margin_resilience
    name: 毛利率韧性
    description: 毛利率同比变化不低于 -2 个百分点。
    metric: gross_margin_delta_yoy
    operator: ">="
    threshold: -0.02
  - id: cashflow_quality
    name: 现金流质量
    description: 经营现金流对归母净利润有较强覆盖。
    metric: ocf_to_np
    operator: ">="
    threshold: 0.80
  - id: highfreq_revenue
    name: 高频收入端验证
    description: 高频经营信号对收入端形成支持。
    highfreq_side: revenue_side
    expected: positive
  - id: highfreq_cashflow
    name: 高频现金流压力
    description: 高频经营信号不应显示现金流明显负面。
    highfreq_side: cashflow_side
    expected_not: negative
