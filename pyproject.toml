[project]
name = "fundamental-pulse"
version = "0.1.0"
description = "Lightweight quarterly fundamental growth classifier."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pydantic>=2.7",
    "pytest>=8.2",
    "ruff>=0.5",
    "streamlit>=1.36",
    "typer>=0.12",
]

[project.scripts]
pulse = "fundamental_pulse.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
