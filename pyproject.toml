[project]
name = "financial-report-rpg"
version = "0.1.0"
description = "Pixel RPG style financial report reading journey."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.2",
    "ruff>=0.5",
    "streamlit>=1.36",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["financial_report_rpg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
